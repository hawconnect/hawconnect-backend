name: CI

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
on:
    push:
        branches: [dev, main]
    pull_request:
        branches: [dev, main]
jobs:
    checks:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        # Throwaway PostgreSQL for the database suites. The test guards require
        # these exact database names on localhost; nothing here touches staging
        # or production databases.
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: hawconnect_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            HAWCONNECT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hawconnect_test
            HAWCONNECT_ADMIN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hawconnect_console_test
            HAWCONNECT_MIGRATION_TEST_URL: postgres://postgres:postgres@localhost:5432/hawconnect_migration_test
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version
            - name: Install locked dependencies
              run: bun install --frozen-lockfile --ignore-scripts
            - name: Validate local schema generation
              run: bun run codegen
            - name: Run TypeScript and Biome
              run: bun run lint
            - name: Create test databases
              env:
                  PGPASSWORD: postgres
              run: |
                  psql -h localhost -U postgres -c 'CREATE DATABASE hawconnect_console_test'
                  psql -h localhost -U postgres -c 'CREATE DATABASE hawconnect_migration_test'
            - name: Run tests (including database suites)
              run: bun test
