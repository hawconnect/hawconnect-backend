    sourceUrl: String!
}

type CampusLifePublicEvent {
    id: Int!
    organizerId: Int!
    organizerName: String!
    title: MultiLanguageString!
    description: MultiLanguageString!
    startDateTime: String!
    endDateTime: String
    location: String
    eventUrl: String
}
type CampusLifePublicOrganizer {
    id: Int!
    name: String!
    description: MultiLanguageString!
    location: String
    website: String
    instagram: String
    linkedin: String
    nonProfit: Boolean
    registrationNumber: String
}
type CampusLifePublicFeed {
    available: Boolean!
    events: [CampusLifePublicEvent!]!
    organizers: [CampusLifePublicOrganizer!]!
}

"""
A marketplace post. Anyone may browse; posting, contacting and reporting need an account.
"""
type MarketPost {
    id: ID!
    type: String!
    category: String!
    title: String!
    description: String!
    priceEur: Float
    priceFree: Boolean!
    priceUnit: String
    location: String
    """
    ISO date the offer or request becomes available.
    """
    availableFrom: String
    details: MarketDetails!
    status: String!
    createdAt: String!
    expiresAt: String!
    isOwn: Boolean!
    """
    Short-lived signed photo URLs.
    """
    photoUrls: [String!]!
}

"""
Category-specific listing fields; only the ones that apply to the listing are set.
"""
type MarketDetails {
    employer: String
    jobType: String
    workMode: String
    languages: [String!]
    weeklyHours: Int
    requirements: String
    applyMethod: String
    applyUrl: String
    applyEmail: String
    applyDeadline: String
    contactName: String
    contactRole: String
    contactEmail: String
    companyWebsite: String
    skills: String
    portfolioUrl: String
    housingType: String
    rentalDuration: String
    deposit: Int
    rentIncludes: [String!]
    sizeSqm: Int
    rooms: Int
    furnished: String
    facilities: [String!]
    occupation: String
}

type MarketPostPage {
    posts: [MarketPost!]!
    nextCursor: String
}
