    events: [AcademicCalendarEvent!]!
}
type AcademicCalendarEvent {
    id: String!
    name: MultiLanguageString!
    begin: String!
    end: String
    hasHours: Boolean!
}

type HawEventsResponse {
    managedAvailable: Boolean!
    events: [HawEvent!]!
    updatedAt: String
    available: Boolean!
    stale: Boolean!
    truncated: Boolean!
    sourceUrl: String!
}
type HawEvent {
