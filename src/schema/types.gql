    id: String!
    title: String!
    sourceUrl: String!
    date: String!
    endDate: String
    dateLabel: String!
    timeLabel: String
    startTime: String
    endTime: String
    location: String
}

type HawNewsResponse {
    items: [HawNewsItem!]!
    language: String!
    updatedAt: String
    available: Boolean!
    stale: Boolean!
    sourceUrl: String!
}
type HawNewsItem {
    id: String!
    title: String!
    url: String!
    teaser: String
    date: String!
    categories: [String!]!
    imageUrl: String
    imageCredit: String
