"""Announcement data to display on top of the apps dashboard"""
type Announcement {
  """Creation date of the announcement"""
  createdAt: DateTime!

  """Description of the announcement in different languages"""
  description: MultiLanguageString!

  """End date and time when the announcement is displayed"""
  endDateTime: DateTime!

  """Unique identifier of the announcement"""
  id: ID!

  """Image URL for the announcement"""
  imageUrl: String

  """Platform where the announcement is displayed"""
  platform: [Platform!]!

  """Priority of the announcement, higher are more important"""
  priority: Int!

  """Start date and time when the announcement is displayed"""
  startDateTime: DateTime!

  """Title of the announcement in different languages"""
  title: MultiLanguageString!

  """Last update date of the announcement"""
  updatedAt: DateTime!

  """URL to the announcement"""
  url: String

  """UserKind to target the announcement to specific user groups"""
  userKind: [UserKind!]!
}

"""
A café or mensa of the Studierendenwerk Hamburg at an HAW campus, as published on its location page.
"""
type Cafeteria {
  address: [String!]!

  """False when the location page has never been read successfully."""
  available: Boolean!
  campus: String!
  description: String
  distribution: [CafeteriaOpeningLine!]!
  general: [CafeteriaOpeningLine!]!

  """True when English was requested but only the German page is available."""
  germanOnly: Boolean!

  """True when the place has a daily menu in the food query."""
  hasMenu: Boolean!
  id: ID!
  name: String!
  offers: [CafeteriaOffer!]!

  """The Studierendenwerk location page in the requested language."""
  sourceUrl: String!

  """When the served page was last read successfully."""
  updatedAt: String
}

"""
An offer listed on the Studierendenwerk location page (breakfast, seats, pizza, ...).
"""
type CafeteriaOffer {
  key: String!
  title: String!
}

"""
A line of opening hours exactly as published on the Studierendenwerk location page. `parsed` is null when the line is not understood or the German and English pages disagree.
"""
type CafeteriaOpeningLine {
  days: String!
  parsed: ParsedOpening
  time: String!
}

