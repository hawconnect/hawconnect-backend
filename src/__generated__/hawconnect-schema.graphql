"""Meal data"""
type Meal {
  additives: [String!]

  """List of allergens (e.g. gluten, lactose, etc.)"""
  allergens: [String]

  """Category of the meal (main, soup or salad)"""
  category: String!

  """List of flags (e.g. vegan, vegetarian, etc.)"""
  flags: [String]

  """
  Icon names exactly as shown on the Studierendenwerk menu page (e.g. vega, pork, lact), in page order.
  """
  icons: [String!]

  """Unique identifier of the meal on the specific day"""
  id: ID!

  """Unique identifier of the meal, independent of the day"""
  mealId: ID!

  """Name of the meal in different languages"""
  name: MultiLanguageString!

  """Nutritional values for the meal"""
  nutrition: Nutrition

  """Original language of the meal name"""
  originalLanguage: OriginalLanguage!

  """Prices for different types of customers (student, employee, guest)"""
  prices: Prices!

  """
  Restaurant where the meal is available (BerlinerTorMensa, BergedorfMensa, FinkenauMensa)
  """
  restaurant: String!

  """
  Static meals are always available, non-static meals are only available on specific days
  """
  static: Boolean!

  """Variants or toppings of the meal, like bread, sauce, etc."""
  variants: [Variation!]
}

"""String in multiple languages (German and English)"""
type MultiLanguageString {
  """German language code"""
  de: String

  """English language code"""
  en: String
}

"""Input type for the multi language string."""
input MultiLanguageStringInput {
  de: String!
  en: String!
}

type Mutation {
  acceptMarketRules(version: Int!): Boolean!
  accountSync(operations: [AccountSyncOperationInput!]!): AccountSyncResult!
  contactMarketPoster(id: ID!, message: String!): Boolean!
  createMarketPost(input: MarketPostInput!, photoIds: [ID!]): MarketPost!
  deleteMarketPost(id: ID!): Boolean!
  renewMarketPost(id: ID!): MarketPost!
  reportMarketMessage(input: MarketReportInput!, token: String!): Boolean!
  reportMarketPost(id: ID!, input: MarketReportInput!): Boolean!
  setMarketPostStatus(id: ID!, status: String!): MarketPost!
  updateMarketPost(id: ID!, input: MarketPostInput!, photoIds: [ID!]): MarketPost!
}

"""
Nutritional values for a meal. Currently only available at Mensa. Values are per average portion.
"""
type Nutrition {
  """Carbohydrates in grams"""
  carbs: Float!

  """Fat in grams"""
  fat: Float!

  """Saturated fat in grams"""
  fatSaturated: Float!

  """Fiber in grams"""
  fiber: Float!

  """Energy in kilocalories"""
  kcal: Float!

  """Energy in kilojoules"""
  kj: Float!

  """Protein in grams"""
  protein: Float!

  """Salt in grams"""
  salt: Float!

  """Sugar in grams"""
  sugar: Float!
}

"""A line of opening hours exactly as published (days and time range)."""
type OpeningLine {
  days: String!
  time: String!
}

"""Enum representing the original language of a meal."""
enum OriginalLanguage {
  """German language code"""
  de

  """English language code"""
  en
}

"""Parent meal for a variant meal"""
type Parent {
  """Category of the parent meal (main, soup or salad)"""
  category: String!

  """Unique identifier of the parent meal"""
  id: ID!

  """Name of the parent meal in different languages"""
  name: MultiLanguageString!
}

"""
Opening hours of one line in machine-readable form (ISO weekdays 1 = Monday, 24-hour HH:MM in Europe/Berlin).
"""
type ParsedOpening {
  close: String!
  open: String!
  weekdays: [Int!]!
}

"""
Enum representing the platform of the user. This is used to target announcements to specific user groups.
"""
enum Platform {
  """Android"""
  ANDROID

  """iOS"""
  IOS

  """Web"""
  WEB
}

"""Prices for different types of customers"""
type Prices {
  """Price for employees"""
  employee: Float

  """Price for guests"""
  guest: Float

  """Price for students"""
  student: Float
}

"""Root query"""
type Query {
  academicCalendar: AcademicCalendarResponse!
  accountSnapshot: AccountSyncSnapshot!

  """Get the current in app announcements."""
  appAnnouncements(active: Boolean): [Announcement!]!

  """
  The seven Studierendenwerk cafés and mensas at the HAW campuses, in a fixed order.
  """
  cafeterias(language: String = "de"): [Cafeteria!]!
  campusLifeEvents: CampusLifePublicFeed!

  """
  Address and opening hours of the Hamburg canteens, as published on the menu page.
  """
  canteens(language: String = "de"): [Canteen!]!

  """Get the meal plan for a specific restaurant."""
  food(language: String = "de", locations: [LocationInput!]!): FoodResponse!
  hawClubs(language: String = "de"): HawClubsResponse!
  hawEvents(language: String = "de"): HawEventsResponse!

  """
  Latest public HAW Hamburg news (first listing page) in the given language.
  """
  hawNews(language: String = "de"): HawNewsResponse!
  marketPost(id: ID!): MarketPost
  marketPosts(cursor: String, filter: MarketFilter): MarketPostPage!
  marketRulesAccepted: Boolean!
  myMarketPosts: [MarketPost!]!
}

"""
Enum representing the different restaurant locations. This is used as a parameter for the food query.
"""
enum RestaurantLocation {
  BergedorfMensa
  BerlinerTorMensa
  FinkenauMensa
}

scalar URL

"""
Enum representing the kind of user. This is used to target announcements to specific user groups.
"""
enum UserKind {
  """Employee"""
  EMPLOYEE

  """Guest"""
  GUEST

  """Student"""
  STUDENT
}

"""Variants of a meal"""
type Variation {
  """
  True if the variant is an additional topping and not a variant of the meal
  """
  additional: Boolean!

  """List of allergens (e.g. gluten, lactose, etc.)"""
  allergens: [String]

  """List of flags (e.g. vegan, vegetarian, etc.)"""
  flags: [String]

  """Unique identifier of the variant"""
  id: ID!

  """Unique identifier of the meal, independent of the day"""
  mealId: ID!

  """Name of the variant in different languages"""
  name: MultiLanguageString!

  """Nutritional values for the variant"""
  nutrition: Nutrition

  """Original language of the variant name"""
  originalLanguage: OriginalLanguage!

  """Parent meal for a variant meal"""
  parent: Parent

  """Prices for different types of customers (student, employee, guest)"""
  prices: Prices!

  """
  Restaurant where the variant is available (BerlinerTorMensa, BergedorfMensa, FinkenauMensa)
  """
  restaurant: String

  """
  Static variants are always available, non-static variants are only available on specific days
  """
  static: Boolean!
}